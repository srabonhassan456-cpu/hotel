<title>হোটেল রান্না ও বাজার লিস্ট</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f0;--card:#fff;--tx:#10241f;--mu:#5f7570;--ac:#0b5d4b;--ac2:#f2a900;--bd:#dbe5e0;--rd:#c8402b;--pan:#0b3d33;--pt:#eafaf3;--hl:#fff6dc;--hd:#0b3d33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1614;--card:#15251f;--tx:#e8f3ee;--mu:#8fa8a1;--ac:#3ec9a0;--bd:#25403a;--rd:#ff7a63;--pan:#0a2b24;--hl:#3a3112;--hd:#08201b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1614;--card:#15251f;--tx:#e8f3ee;--mu:#8fa8a1;--ac:#3ec9a0;--bd:#25403a;--rd:#ff7a63;--pan:#0a2b24;--hl:#3a3112;--hd:#08201b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;font-size:16px;line-height:1.5}
.top{background:var(--hd);color:#fff;padding:22px 16px 26px;border-bottom:4px solid var(--ac2)}
.top div{max-width:640px;margin:0 auto}
.dt{position:relative;display:inline-block}.dt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.top small{color:var(--ac2);font-weight:600;font-size:14px}
h1{font-size:26px;line-height:1.25;margin:2px 0 0;font-weight:700}
main{max-width:640px;margin:0 auto;padding:6px 14px 40px}
h2{font-size:19px;margin:26px 0 4px;font-weight:700}
.hint{color:var(--mu);font-size:14px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px 14px;margin-bottom:14px;box-shadow:0 1px 2px rgba(11,61,51,.06)}
.shopcard{border-left:5px solid var(--ac)}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac2);outline-offset:1px}
.it{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--bd)}
.nm{flex:1;min-width:0}
.q{width:66px;text-align:center;font-weight:600}
.q:not(:placeholder-shown){background:var(--hl);border-color:var(--ac2)}
.u{width:86px;padding:8px 2px}
.x{background:none;border:0;color:var(--mu);font-size:17px;cursor:pointer;padding:4px 7px;border-radius:8px}
.x:hover{color:var(--rd)}
.btn{background:#0b5d4b;color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.y{background:var(--ac2);color:#10241f}
.add{display:flex;gap:6px;padding:10px 0}
.add input{flex:1}
.sh{display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px;font-weight:700}
.badge{background:var(--ac2);color:#10241f;border-radius:20px;padding:0 9px;font-size:13px;margin-left:8px}
.sum{background:var(--pan);color:var(--pt);border-radius:16px;padding:16px;line-height:1.8;border-top:4px solid var(--ac2)}
.sum b{display:block;margin-top:12px;color:var(--ac2);font-size:17px}
.sum b:first-child{margin-top:0}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row .btn{flex:1;min-width:120px}
</style>
</head>
<body>
<header class="top"><div><label class="dt"><small id="date"></small><input type="date" id="dp" onchange="setDate(this.value)" aria-label="তারিখ বদলান"></label><h1>হোটেল রান্না ও বাজার লিস্ট</h1></div></header>
<main>

<h2>♨️ রান্নার হিসাব</h2>
<div class="hint">আজ কোনটা কতটুকু রান্না হয়েছে বা আছে।</div>
<div id="cook"></div>

<h2>কোন দোকান থেকে কী লাগবে</h2>
<div class="hint">যেটা লাগবে শুধু তার পরিমাণ লিখুন। ফাঁকা থাকলে লিস্টে আসবে না।</div>
<div id="shops"></div>
<button class="btn g" onclick="addShop()">+ নতুন দোকান</button>

<h2>মালিকের জন্য সারাংশ (নিজে নিজে তৈরি)</h2>
<div id="sum" class="sum"></div>
<div class="row">
<button class="btn y" onclick="share()">WhatsApp এ পাঠান</button>
<button class="btn g" onclick="copyList()">কপি করুন</button>
<button class="btn g" onclick="clearNeeds()">লাগবে সব মুছুন</button>
</div>
<div id="msg" style="color:var(--mu);font-size:14px;margin-top:8px"></div>
<textarea id="box" readonly hidden rows="9" style="width:100%;margin-top:8px;font:inherit;font-size:15px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px"></textarea>
</main>

<script>
var KEY="hotelV2",U=["কেজি","গ্রাম","লিটার","পিস","প্যাকেট","ডজন","বস্তা","বোতল","প্লেট"];
function mk(names,u){return names.map(function(n){return{n:n,q:"",u:u}})}
function seed(){
var f=mk(["পোলাও চাল","খিচুড়ি চাল","মিনিকেট চাল","ময়দা","তেল (নাস্তা + বিরিয়ানি)","বুটের ডাল","আলু","পেয়াজ","ম্যাগী মসলা","আদা","রসুন","টেস্টিং সল্ট","চিকন লবণ","মোটা লবন","গুড়ো মরিচ","হলুদ","ধনিয়া","আস্ত জিরা","শাহি জিরা","কিসমিস","আলু বোখারা","পাচ ফোড়ন"],"কেজি");
f=f.concat([{n:"কেওড়া জল",q:"",u:"বোতল"},{n:"কাপর ধোয়ার সোডা",q:"",u:"প্যাকেট"},{n:"হুইল পাউডার",q:"",u:"প্যাকেট"},{n:"মিনি সাবান",q:"",u:"পিস"}]);
f[4].u="লিটার";
return{cook:[["পোলাও",3,"কেজি"],["খিচুড়ি",6,"প্লেট"],["সাদা ভাত",500,"গ্রাম"],["চিকেন রোস্ট",19,"পিস"],["চিকেন কারি",0,"পিস"],["ডিম সিদ্ধ",24,"পিস"],["ডিম ভুনা",5,"পিস"],["তেহারির মাংস",2,"প্যাকেট"],["বিফ রেজালা",0,"পিস"],["মাছ কারি",0,"পিস"],["সিংগাড়া",125,"পিস"],["ডিম চপ",12,"পিস"]].map(function(a){return{n:a[0],q:a[1],u:a[2]}}),
shops:[
{name:"ফাহিম স্টোর (গ্রোসারি)",items:f},
{name:"আরং এর গাড়ি",items:mk(["টক দই"],"কেজি")},
{name:"লিটন (চিকেন এন্ড ফিশ শপ)",items:mk(["চিকেন","মাছ"],"কেজি")},
{name:"বেংগল মীট",items:mk(["তেহারি মাংস","চিকেন"],"কেজি")},
{name:"কাচা বাজার (কবিরের দোকান)",items:mk(["পেপে","গাজর","কাচা মরিচ"],"কেজি").concat(mk(["লেবু","শসা"],"পিস"),mk(["মিষ্টি কুমড়া (ক্যাটারিং এর জন্য)"],"কেজি"))},
{name:"খাটি পল্লী",items:mk(["ডিম"],"পিস").concat(mk(["স্টাফ চাল"],"কেজি"))},
{name:"স্টেশনারি (সামিন ডিসপো সেন্টার)",items:mk(["বড়ো কাগজের ঠোংগা","মাঝারি কাগজের ঠোংগা","ছোট কাগজের ঠোংগা","টিস্যু পেপার","১ কেজির হ্যান্ড পলি","৩ কেজির হ্যান্ড পলি","৫ কেজি হ্যান্ড পলি","কালো ময়লার পলি","ফুড গ্রেড মিনি পলি","সস পলি","কফি কাপ","হ্যান্ড গ্লোভস","জি ক্যাপ","কোকের স্ট্রো","তেহেরীর বক্স","চিকেন পোলাও এর বক্স","থ্রি চেম্বার বক্স","বিরিয়ানি প্লাস্টিক বাটি"],"প্যাকেট")}
]}}
var D=seed();
try{var r=localStorage.getItem(KEY);if(r)D=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function bn(v){return String(v).replace(/\d/g,function(d){return"০১২৩৪৫৬৭৮৯"[d]})}
function usel(u,cb){return'<select class="u" onchange="'+cb+'">'+U.map(function(x){return"<option"+(x==u?" selected":"")+">"+x+"</option>"}).join("")+"</select>"}
function row(a,k,fn){return'<div class="it"><span class="nm">'+esc(a.n)+'</span><input class="q" type="number" min="0" step="any" placeholder="–" value="'+a.q+'" onchange="'+fn+'(\'q\',this.value)">'+usel(a.u,fn+"('u',this.value)")+'<button class="x" onclick="'+fn.replace("set","del").replace(/,$/,")")+'">✕</button></div>'}
function render(){
var h='<div class="card">';
D.cook.forEach(function(a,i){h+=row(a,i,"setC("+i+",")});
h+='<div class="add"><input id="cn" placeholder="নতুন রান্নার আইটেম"><button class="btn" onclick="addC()">যোগ</button></div></div>';
$("cook").innerHTML=h;
h="";
D.shops.forEach(function(s,si){
var cn=s.items.filter(function(a){return a.q!==""&&+a.q>0}).length;h+='<div class="sh"><span>'+esc(s.name)+(cn?'<span class="badge">'+bn(cn)+'</span>':'')+'</span><button class="x" onclick="delShop('+si+')" title="দোকান মুছুন">✕</button></div><div class="card shopcard">';
s.items.forEach(function(a,ii){h+=row(a,ii,"setI("+si+","+ii+",")});
h+='<div class="add"><input id="in'+si+'" placeholder="নতুন আইটেম"><button class="btn" onclick="addI('+si+')">যোগ</button></div></div>'});
$("shops").innerHTML=h;summary()}
function setC(i,f,v){D.cook[i][f]=f=="q"?(v===""?"":+v):v;save();summary()}
function delC(i){D.cook.splice(i,1);save();render()}
function addC(){var v=$("cn").value.trim();if(!v)return;D.cook.push({n:v,q:0,u:"পিস"});save();render()}
function setI(s,i,f,v){D.shops[s].items[i][f]=f=="q"?(v===""?"":+v):v;save();render()}
function delI(s,i){D.shops[s].items.splice(i,1);save();render()}
function addI(s){var v=$("in"+s).value.trim();if(!v)return;D.shops[s].items.push({n:v,q:"",u:"কেজি"});save();render()}
function addShop(){var v=prompt("দোকানের নাম:");if(v&&v.trim()){D.shops.push({name:v.trim(),items:[]});save();render()}}
function delShop(i){if(confirm("দোকানটি পুরো মুছে ফেলবেন?")){D.shops.splice(i,1);save();render()}}
function clearNeeds(){if(confirm("সব 'লাগবে' পরিমাণ মুছে নতুন দিনের জন্য ফাঁকা করবেন?")){D.shops.forEach(function(s){s.items.forEach(function(a){a.q=""})});save();render()}}
function data(){var c=D.cook.map(function(a){return a.n+": "+bn(a.q)+" "+a.u});
var s=D.shops.map(function(s){return{name:s.name,l:s.items.filter(function(a){return a.q!==""&&+a.q>0}).map(function(a){return a.n+" লাগবে "+bn(a.q)+" "+a.u})}}).filter(function(s){return s.l.length});
return{c:c,s:s}}
function summary(){var d=data(),h='<b style="margin-top:0">♨️ রান্নার হিসাব</b>'+d.c.map(function(x){return"• "+esc(x)}).join("<br>");
if(!d.s.length)h+='<b>বাজারে কিছু লাগবে না</b>';
d.s.forEach(function(s){h+="<b>"+esc(s.name)+"</b>"+s.l.map(function(x){return"• "+esc(x)}).join("<br>")});
$("sum").innerHTML=h}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function curDate(){var t=iso(new Date());try{var o=JSON.parse(localStorage.getItem("hotelDate")||"null");if(o&&o.on==t&&o.set)return o.set}catch(e){}return t}
function dtxt(){return new Date(curDate()+"T00:00:00").toLocaleDateString("bn-BD",{weekday:"long",day:"numeric",month:"long"})}
function showDate(){$("date").textContent=dtxt()+" ✎";$("dp").value=curDate()}
function setDate(v){if(!v)return;try{localStorage.setItem("hotelDate",JSON.stringify({set:v,on:iso(new Date())}))}catch(e){}showDate()}
function text(){var d=data(),t="আজকের হিসাব ("+dtxt()+")\n\n♨️ রান্নার হিসাব\n"+d.c.map(function(x){return"• "+x}).join("\n");
d.s.forEach(function(s){t+="\n\n*"+s.name+"*\n"+s.l.map(function(x){return"• "+x}).join("\n")});return t}
function showBox(m){var b=$("box");b.value=text();b.hidden=false;$("msg").textContent=m;try{b.focus();b.select();b.setSelectionRange(0,99999)}catch(e){}}
function share(){var t=text(),u="https://wa.me/?text="+encodeURIComponent(t);
function wa(){var w=null;try{w=window.open(u,"_blank")}catch(e){}if(!w){showBox("WhatsApp খোলেনি। নিচের লেখা চেপে ধরে কপি করুন, তারপর WhatsApp এ পেস্ট করুন।")}}
if(navigator.share){navigator.share({text:t}).catch(function(e){if(!e||e.name!="AbortError")wa()})}else wa()}
function copyList(){var t=text();
function fb(){try{var b=$("box");b.hidden=false;b.value=t;b.focus();b.select();b.setSelectionRange(0,99999);if(document.execCommand("copy")){$("msg").textContent="কপি হয়েছে।";return}}catch(e){}showBox("কপি হয়নি। নিচের লেখা চেপে ধরে কপি করুন।")}
try{navigator.clipboard.writeText(t).then(function(){$("msg").textContent="কপি হয়েছে।"},fb)}catch(e){fb()}}
showDate();
render();
</script>
</body>
</html>
